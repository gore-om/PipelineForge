trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  AWS_REGION: us-east-1
  TF_WORKING_DIR: infra/aws-production
  IMAGE_TAG: $(Build.BuildId)

stages:
  - stage: Validate
    displayName: Validate application
    jobs:
      - job: Checks
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: "24.x"
            displayName: Use Node.js
          - script: npm ci
            displayName: Install dependencies
          - script: npm run build
            displayName: Build workspaces

  - stage: BuildImages
    displayName: Build and push images
    dependsOn: Validate
    jobs:
      - job: Docker
        steps:
          - task: Docker@2
            displayName: Build and push frontend
            inputs:
              command: buildAndPush
              repository: pipelineforge-production-frontend
              dockerfile: client/Dockerfile
              buildContext: .
              containerRegistry: AWS_ECR_SERVICE_CONNECTION
              tags: |
                $(IMAGE_TAG)
          - task: Docker@2
            displayName: Build and push API
            inputs:
              command: buildAndPush
              repository: pipelineforge-production-api
              dockerfile: server/Dockerfile
              buildContext: .
              containerRegistry: AWS_ECR_SERVICE_CONNECTION
              tags: |
                $(IMAGE_TAG)

  - stage: TerraformPlan
    displayName: Terraform plan
    dependsOn: BuildImages
    jobs:
      - job: Plan
        steps:
          - script: |
              terraform -chdir=$(TF_WORKING_DIR) init -backend-config=backend.hcl
              terraform -chdir=$(TF_WORKING_DIR) plan \
                -var="frontend_image_tag=$(IMAGE_TAG)" \
                -var="api_image_tag=$(IMAGE_TAG)" \
                -out=tfplan
            displayName: Terraform plan

  - stage: TerraformApply
    displayName: Terraform apply
    dependsOn: TerraformPlan
    condition: false
    jobs:
      - deployment: Apply
        environment: pipelineforge-production
        strategy:
          runOnce:
            deploy:
              steps:
                - script: |
                    terraform -chdir=$(TF_WORKING_DIR) apply -auto-approve tfplan
                  displayName: Terraform apply
